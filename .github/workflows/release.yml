name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - run: npm ci
      - run: npm run check
      - name: Build release tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/dsh-nx-*.tgz release/dsh-nx.tgz
          tar -tzf release/dsh-nx.tgz | grep -q 'package/lib/server.js'
          tar -tzf release/dsh-nx.tgz | grep -q 'package/cordis.patch.yml'
          tar -tzf release/dsh-nx.tgz | grep -q 'package/skills/nx-modeling/SKILL.md'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/dsh-nx.tgz --verify-tag --generate-notes
